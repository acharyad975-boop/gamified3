{% extends "base.html" %}
{% block title %}{{ action }} Quiz — Teacher Portal{% endblock %}
{% block page_title %}{{ action }} Quiz{% endblock %}

{% block content %}
<div class="breadcrumb mb-16">
  <a href="{% url 'teacher_quizzes' %}">Quizzes</a>
  <span class="breadcrumb-sep">/</span>
  <span class="breadcrumb-current">{{ action }} Quiz</span>
</div>

<div class="card" style="max-width:800px;margin:0 auto;padding:32px;">
  <h1 style="font-size:22px;font-weight:800;margin-bottom:20px;">{{ action }} Quiz</h1>

  <form method="post">
    {% csrf_token %}
    <div class="form-group">
      <label class="form-label">Title *</label>
      <input type="text" name="title" class="form-control" value="{{ quiz.title|default:'' }}" placeholder="e.g., Python Basics Quiz" required>
    </div>

    <div class="form-group">
      <label class="form-label">Description</label>
      <textarea name="description" class="form-control" rows="2" placeholder="Brief description of the quiz">{{ quiz.description|default:'' }}</textarea>
    </div>

    <div class="grid-3">
      <div class="form-group mb-0">
        <label class="form-label">Difficulty</label>
        <select name="difficulty" class="form-control">
          <option value="BEGINNER" {% if quiz.difficulty == 'BEGINNER' %}selected{% endif %}>Beginner</option>
          <option value="INTERMEDIATE" {% if quiz.difficulty == 'INTERMEDIATE' %}selected{% endif %}>Intermediate</option>
          <option value="ADVANCED" {% if quiz.difficulty == 'ADVANCED' %}selected{% endif %}>Advanced</option>
        </select>
      </div>
      <div class="form-group mb-0">
        <label class="form-label">Time Limit (mins)</label>
        <input type="number" name="time_limit_minutes" class="form-control" value="{{ quiz.time_limit_minutes|default:10 }}" required>
      </div>
      <div class="form-group mb-0">
        <label class="form-label">XP Reward</label>
        <input type="number" name="xp_reward" class="form-control" value="{{ quiz.xp_reward|default:100 }}" required>
      </div>
    </div>

    <div style="display:flex;gap:12px;margin-top:24px;">
      <button type="submit" class="btn btn-primary">{{ action }} Quiz</button>
      <a href="{% url 'teacher_quizzes' %}" class="btn btn-secondary">Cancel</a>
    </div>
  </form>
</div>
{% endblock %}
